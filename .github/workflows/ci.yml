name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches charges.yaml going stale (> 90 days)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,parquet]"
      - run: ruff check .
      - run: python scripts/validate_index.py
      - run: pytest
      - run: python scripts/build_packages.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: skill-packages
          path: skill-packages/*.skill

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
