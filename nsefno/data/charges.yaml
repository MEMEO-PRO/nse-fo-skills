# Statutory + exchange charges for Indian equity derivatives (F&O).
# Every rate carries effective_from + a source link. A CI test fails when
# `reviewed_on` is older than 90 days, forcing a re-check after budgets/circulars.
#
# Units: `pct` values are PERCENT (0.15 means 0.15%). `per_crore` is INR per 1e7 turnover.
reviewed_on: 2026-11-21

stt:
  # Securities Transaction Tax, Finance Act 2026 (Budget 2026), effective 1 Apr 2026.
  - effective_from: 2026-04-01
    option_sell_premium_pct: 0.15     # seller, on premium
    option_exercise_intrinsic_pct: 0.15  # buyer, on intrinsic value of exercised (ITM) options
    future_sell_pct: 0.05             # seller, on traded value
    source: https://zerodha.com/marketintel/bulletin/445377/revision-in-stt-securities-transaction-tax-from-1st-april-2026
  - effective_from: 2024-10-01
    option_sell_premium_pct: 0.10
    option_exercise_intrinsic_pct: 0.125
    future_sell_pct: 0.02
    source: https://www.icicidirect.com/ilearn/futures-and-options/articles/stt-changes-in-budget-2026-what-f-o-traders-should-know

exchange_txn:
  # Exchange transaction charges, both sides. NSE folded the IPFT contribution
  # into transaction charges from 1 Mar 2026 (net outflow unchanged).
  NSE:
    - effective_from: 2026-03-01
      option_premium_pct: 0.03553
      future_pct: 0.00183
      source: https://zerodha.com/charges/
    - effective_from: 2024-10-01
      option_premium_pct: 0.03503
      future_pct: 0.00173
      source: https://zerodha.com/marketintel/bulletin/391488/revision-in-transactions-charges-from-1st-october-2024
  BSE:
    - effective_from: 2024-10-01
      option_premium_pct: 0.0325      # SENSEX / BANKEX options
      future_pct: 0.0
      source: https://zerodha.com/charges/

sebi_fee:
  - effective_from: 2021-06-01
    per_crore: 10.0                   # both sides, on turnover (premium for options)
    source: https://zerodha.com/charges/

stamp_duty:
  # Indian Stamp Act (uniform since 1 Jul 2020), BUY side only.
  - effective_from: 2020-07-01
    option_buy_pct: 0.003
    future_buy_pct: 0.002
    source: https://zerodha.com/charges/

gst:
  - effective_from: 2017-07-01
    pct: 18.0                         # on brokerage + exchange txn + SEBI fee
    source: https://zerodha.com/charges/

# Per-broker brokerage. Users can override with ~/.nsefno/brokerage.yaml.
brokerage:
  zerodha:
    option: { type: flat_per_order, amount: 20.0 }
    future: { type: min_of_pct_or_flat, pct: 0.03, amount: 20.0 }
    source: https://zerodha.com/charges/
    reviewed_on: 2026-11-21
  kotak_neo:
    option: { type: flat_per_order, amount: 10.0 }
    future: { type: flat_per_order, amount: 10.0 }
    source: https://www.kotakneo.com/pricing/
    reviewed_on: 2026-11-21
    note: "Trade Free plan, carry-forward F&O. Check your own plan."
  zero:
    option: { type: flat_per_order, amount: 0.0 }
    future: { type: flat_per_order, amount: 0.0 }
    source: n/a
